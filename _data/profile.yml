short_bio: >-
  <p>
    I am a Postdoctoral Research Fellow at the
    <a href="https://mox.polimi.it/" target="_blank">MOX Laboratory</a>,
    Department of Mathematics, Politecnico di Milano.
    My research lies at the intersection of numerical analysis,
    numerical linear algebra, and scientific machine learning.
  </p>

  <p>
    I am particularly interested in iterative solvers and preconditioning
    for partial differential equations, including Krylov subspace methods,
    operator preconditioning, mixed-dimensional and multiphysics problems,
    and learning-enhanced numerical methods.
  </p>

